<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <style>
      .pulsing-glow-1 {
        animation: pulse1 7s ease-in-out infinite alternate;
        transform-origin: 250px 150px;
      }
      .pulsing-glow-2 {
        animation: pulse2 8s ease-in-out infinite alternate;
        transform-origin: 950px 250px;
      }
      .float-card-1 {
        animation: floatA 5s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatB 6s ease-in-out infinite;
      }
      .float-card-3 {
        animation: floatC 5.5s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      .check-pulse {
        animation: checkGlow 3s ease-in-out infinite;
      }

      @keyframes pulse1 {
        0% { transform: scale(0.9) translate(0px, 0px); opacity: 0.35; }
        100% { transform: scale(1.15) translate(30px, 20px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0px, 0px); opacity: 0.3; }
        100% { transform: scale(0.85) translate(-25px, -15px); opacity: 0.6; }
      }
      @keyframes floatA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes floatC {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -280; }
      }
      @keyframes checkGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #10B981); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 8px #10B981); }
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 0.5px;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.4px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Layer 1 - deepest background) -->
  <g>
    <circle class="pulsing-glow-1" cx="250" cy="120" r="160" fill="#6366F1" opacity="0.4" filter="url(#glowBlur)" />
    <circle class="pulsing-glow-2" cx="960" cy="240" r="170" fill="#06B6D4" opacity="0.35" filter="url(#glowBlur)" />
    <circle cx="600" cy="380" r="140" fill="#8B5CF6" opacity="0.25" filter="url(#glowBlur)" />
  </g>

  <!-- Tech Grid / Perspective Matrix Lines (Subtle) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Animated Dynamic Workflow Lines (Layer 2) -->
  <g fill="none" opacity="0.4">
    <path class="flow-line" d="M 60,330 C 220,380 320,320 480,350 S 800,380 1140,320" stroke="url(#accentPurple)" stroke-width="2" />
    <path class="flow-line" d="M 50,70 C 260,30 380,90 600,60 S 920,20 1150,70" stroke="url(#accentCyan)" stroke-width="2" />
  </g>

  <!-- Floating Dynamic Decorative Task Cards (Layer 3 - Positioned at margins, away from center) -->
  
  <!-- Left Side: Task Progress Widget -->
  <g class="float-card-1" transform="translate(60, 115)" filter="url(#cardShadow)">
    <rect width="210" height="155" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="18" width="60" height="8" rx="4" fill="#64748B" opacity="0.6" />
    
    <!-- Item 1: Done -->
    <circle cx="28" cy="46" r="8" fill="#10B981" />
    <path d="M 25 46 L 27 48 L 32 43" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="44" y="50" class="badge-text" fill="#94A3B8">Inbox Zero</text>
    <rect x="155" y="42" width="38" height="8" rx="4" fill="#10B981" fill-opacity="0.3" />

    <!-- Item 2: In Progress -->
    <circle cx="28" cy="78" r="8" fill="#F59E0B" />
    <circle cx="28" cy="78" r="4" fill="#FFFFFF" />
    <text x="44" y="82" class="badge-text" fill="#F8FAFC">Sprint GTD</text>
    <rect x="150" y="74" width="43" height="8" rx="4" fill="#F59E0B" fill-opacity="0.3" />

    <!-- Item 3: CalDAV Sync -->
    <circle cx="28" cy="110" r="8" fill="#6366F1" />
    <path d="M 24 110 L 32 110" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="44" y="114" class="badge-text" fill="#94A3B8">Cloud Sync</text>
    <rect x="160" y="106" width="33" height="8" rx="4" fill="#6366F1" fill-opacity="0.3" />

    <!-- Progress bar -->
    <rect x="18" y="136" width="175" height="5" rx="2.5" fill="#334155" />
    <rect x="18" y="136" width="125" height="5" rx="2.5" fill="url(#accentCyan)" />
  </g>

  <!-- Right Side: Kanban / Metrics Widget -->
  <g class="float-card-2" transform="translate(930, 115)" filter="url(#cardShadow)">
    <rect width="210" height="155" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <text x="18" y="32" class="badge-text" fill="#F8FAFC">Ecosystem Metrics</text>
    
    <!-- Mini KPI 1 -->
    <rect x="18" y="46" width="82" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="26" y="62" class="body-text" font-size="10" fill="#94A3B8">OPEN SOURCE</text>
    <text x="26" y="81" class="title-text" font-size="15" fill="#38BDF8">19+ Repos</text>

    <!-- Mini KPI 2 -->
    <rect x="110" y="46" width="82" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="118" y="62" class="body-text" font-size="10" fill="#94A3B8">SAAS TITANS</text>
    <text x="118" y="81" class="title-text" font-size="15" fill="#A78BFA">10 Suites</text>

    <!-- Self-Hosted Tag -->
    <g transform="translate(18, 102)">
      <rect width="174" height="36" rx="8" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="32" cy="18" r="6" fill="#10B981" />
      <text x="46" y="22" class="badge-text" fill="#34D399">100% Data Sovereignty</text>
    </g>
  </g>

  <!-- Floating Pills (Dynamic decorative elements on margins) -->
  <g class="float-card-3" transform="translate(100, 310)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="65" y="20" class="badge-text" fill="#A5B4FC" text-anchor="middle">⚡ GTD Workflows</text>
  </g>

  <g class="float-card-1" transform="translate(970, 50)">
    <rect width="135" height="32" rx="16" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="67" y="20" class="badge-text" fill="#67E8F9" text-anchor="middle">🛡️ Privacy-First</text>
  </g>

  <!-- Central Foreground Shield / Text Container (guarantees text remains in clear foreground) -->
  <g transform="translate(300, 45)">
    <!-- Backing Glass Card with subtle border -->
    <rect width="600" height="310" rx="20" fill="#0B0F19" fill-opacity="0.92" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Top Pill / Super-header -->
    <g transform="translate(180, 24)">
      <rect width="240" height="30" rx="15" fill="url(#accentPurple)" fill-opacity="0.2" stroke="url(#accentPurple)" stroke-width="1.2" />
      <circle cx="20" cy="15" r="4.5" fill="#EC4899" />
      <text x="126" y="20" class="badge-text" fill="#E0E7FF" text-anchor="middle">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="300" y="112" class="title-text" font-size="34" fill="#FFFFFF" text-anchor="middle" filter="url(#softGlow)">Awesome Task &amp; To-Do</text>
    <text x="300" y="156" class="title-text" font-size="34" fill="url(#accentPurple)" text-anchor="middle">Management</text>

    <!-- Subtitle -->
    <text x="300" y="200" class="body-text" font-size="16" fill="#94A3B8" text-anchor="middle">Top SaaS Leaders &amp; Self-Hosted Open-Source Platforms</text>
    <text x="300" y="224" class="body-text" font-size="13" fill="#64748B" text-anchor="middle">GTD Methodologies • Real-Time Collaboration • CalDAV &amp; Markdown Sync</text>

    <!-- Bottom Feature Badges -->
    <g transform="translate(70, 250)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="70" y="21" class="badge-text" fill="#CBD5E1" text-anchor="middle">💼 10 SaaS Titans</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="150" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="75" y="21" class="badge-text" fill="#CBD5E1" text-anchor="middle">🔓 19+ Open Source</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(320, 0)">
        <rect width="140" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="70" y="21" class="badge-text" fill="#CBD5E1" text-anchor="middle">📊 Star Rankings</text>
      </g>
    </g>
  </g>
</svg>
